[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localpilot"
version = "0.1.5"
description = "Local AI, Made Simple. Discover, install, run, chat with, and manage 100% private, offline LLMs on your computer with automatic hardware detection and a friendly TUI/CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
authors = [
    { name = "Mohamed Fouad Fakhruldeen", email = "fakhruldeen@gmail.com" }
]
maintainers = [
    { name = "Mohamed Fouad Fakhruldeen", email = "fakhruldeen@gmail.com" }
]

keywords = [
    "ai",
    "artificial-intelligence",
    "chat",
    "chatbot",
    "cli",
    "deepseek",
    "gguf",
    "hardware-aware",
    "huggingface",
    "llama",
    "llama-cpp",
    "llm",
    "llm-tools",
    "llmops",
    "local",
    "local-ai",
    "local-first",
    "local-llm",
    "mistral",
    "model-manager",
    "novice",
    "novice-friendly",
    "novice-guide",
    "offline-first",
    "ollama",
    "private-ai",
    "qwen",
    "terminal",
    "textual",
    "tui",
    "vllm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: Arabic",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: System :: Systems Administration",
    "Topic :: Terminals",
    "Topic :: Utilities",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "textual>=0.80.0",
    "httpx>=0.27.0",
    "psutil>=6.0.0",
    "pydantic>=2.9.0",
    "huggingface_hub>=0.25.0",
    "keyring>=25.0.0",
]

[project.urls]
Homepage = "https://fakhruldeen.github.io/LocalPilot/"
Documentation = "https://fakhruldeen.github.io/LocalPilot/"
Repository = "https://github.com/fakhruldeen/LocalPilot"
"Author Website" = "https://fakhr.me"
Issues = "https://github.com/fakhruldeen/LocalPilot/issues"
Discussions = "https://github.com/fakhruldeen/LocalPilot/discussions"
Changelog = "https://github.com/fakhruldeen/LocalPilot/releases"
Zenodo = "https://doi.org/10.5281/zenodo.23424540"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
localpilot = "localpilot.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/localpilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
