[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localpilot"
version = "0.1.1"
description = "A friendly application that helps you discover, install, run, monitor, update and remove local AI models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
authors = [
    { name = "Mohamed Fouad Fakhruldeen", email = "fakhruldeen@gmail.com" }
]
maintainers = [
    { name = "Mohamed Fouad Fakhruldeen", email = "fakhruldeen@gmail.com" }
]

keywords = [
    "huggingface",
    "linux",
    "macos",
    "llm",
    "llm-tools",
    "llmops",
    "local",
    "local-ai",
    "local-first",
    "local-llm",
    "novice",
    "novice-friendly",
    "novice-guide",
    "ollama",
    "vllm",
    "llama-cpp",
    "gguf",
    "model-manager",
    "tui",
    "cli",
    "textual",
    "offline-first",
    "ai-models",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Systems Administration",
    "Topic :: Terminals",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "textual>=0.80.0",
    "httpx>=0.27.0",
    "psutil>=6.0.0",
    "pydantic>=2.9.0",
    "huggingface_hub>=0.25.0",
    "keyring>=25.0.0",
]

[project.urls]
Homepage = "https://fakhruldeen.github.io/LocalPilot/"
Documentation = "https://fakhruldeen.github.io/LocalPilot/"
Repository = "https://github.com/fakhruldeen/LocalPilot"
"Author Website" = "https://fakhr.me"
Issues = "https://github.com/fakhruldeen/LocalPilot/issues"
Changelog = "https://github.com/fakhruldeen/LocalPilot/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
localpilot = "localpilot.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/localpilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
